[build]
  command = "npm run check"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
[functions]
  node_bundler = "esbuild"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[functions."reminders"]
  schedule = "*/15 * * * *"

# Only the sign-in page is rendered at the edge. Static app files (startup pack,
# artwork, icons) are served directly with the default revalidating cache headers.
[[edge_functions]]
  function = "family-gate"
  path = "/login"
