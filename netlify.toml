[build]
  command = "npm run check"
  publish = "dist"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "22"
[functions]
  node_bundler = "esbuild"
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[functions."reminders"]
  schedule = "*/15 * * * *"

# Price Scout licensed-feed import: 06:30 Australia/Sydney on Wed & Sat (two UTC
# slots cover daylight saving; the function checks the Sydney hour itself).
[functions."grocery-cron"]
  schedule = "30 19,20 * * 2,5"

[[edge_functions]]
  function = "family-gate"
  path = "/*"
