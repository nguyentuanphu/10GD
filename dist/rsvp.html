<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Lời mời · FamTray · Bếp Nhà</title>
<link rel="icon" href="family-logo.png" type="image/png">
<!-- v1.7.13 guest invitations: the page a guest opens from the family's link (no account, no app). Reads only this
     invitation's public part (/.netlify/functions/rsvp?t=…) and sends the guest's answer. Script: rsvp-page.js. -->
<style>
:root{--bg:#f6f5f0;--panel:#fffefa;--line:#e2e1d8;--text:#22332b;--muted:#5f6a62;--green:#174e3c;--green2:#2f7a5d;--mint:#eef5ec;--accent:#b8643a;--focus:#c87649;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111714;--panel:#18211c;--line:#2f3b34;--text:#e6ece8;--muted:#a7b3ab;--green:#3ca37c;--green2:#63c39d;--mint:#1d352c;--accent:#e39a6f;--focus:#e39a6f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,'Be Vietnam Pro',sans-serif;-webkit-text-size-adjust:100%}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 40px max(16px,env(safe-area-inset-left))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.brand{display:flex;align-items:center;gap:8px;min-height:44px;font-weight:700;color:var(--green);text-decoration:none}
.brand img{width:30px;height:30px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{min-width:48px;min-height:44px;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:700;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--green);color:#fff}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 16px;margin:0 0 14px;box-shadow:0 4px 14px rgba(40,50,40,.06)}
h1{font-size:1.45em;line-height:1.25;margin:0 0 6px}
h2{font-size:1.05em;margin:0 0 10px}
.muted{color:var(--muted)}
.meals{list-style:none;padding:0;margin:10px 0 4px;display:grid;gap:6px}
.meals li{padding:8px 12px;border-radius:12px;background:var(--mint);font-weight:700}
.deadline{margin:10px 0 0;font-size:.95em}
.choices{display:grid;gap:8px;margin:4px 0 6px}
.choice{min-height:56px;border:2px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);font:inherit;font-weight:800;font-size:1.05em;cursor:pointer;text-align:left;padding:10px 14px}
.choice[aria-pressed="true"]{border-color:var(--green);background:var(--green);color:#fff}
.step{display:grid;grid-template-columns:minmax(0,1fr) 52px 46px 52px;align-items:center;gap:8px;margin:12px 0 0}
.step b{display:block}.step small{color:var(--muted)}
.step output{text-align:center;font-size:1.35em;font-weight:800}
.round{min-width:52px;min-height:52px;border:1px solid var(--line);border-radius:14px;background:var(--panel);display:grid;place-items:center;cursor:pointer;padding:0}
.round svg{width:30px;height:30px}
label.note{display:grid;gap:6px;margin:14px 0 0;font-weight:700}
textarea{width:100%;min-height:72px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font:inherit;padding:10px}
.primary,.secondary{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border-radius:999px;font:inherit;font-weight:800;font-size:1.05em;cursor:pointer;text-decoration:none;padding:10px 16px;margin-top:12px}
.primary{border:0;background:var(--green);color:#fff}
.secondary{border:2px solid var(--line);background:var(--panel);color:var(--text)}
.primary svg,.secondary svg{width:26px;height:26px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 .secondary{margin-top:10px}
.status{font-size:1.15em;font-weight:800;margin:4px 0}
.status.yes{color:var(--green)}.status.no,.status.busy{color:var(--accent)}
.notice{border-left:4px solid var(--accent);padding:8px 12px;background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:8px;margin:10px 0 0}
.error{color:var(--accent);font-weight:700;margin:10px 0 0}
.intro{text-align:center;padding:16px}
.intro p{margin:0 0 8px}
.intro a{display:inline-flex;align-items:center;min-height:44px;padding:0 8px;color:var(--green);font-weight:800}
[hidden]{display:none!important}
@media (min-width:560px){.choices{grid-template-columns:repeat(3,1fr)}.choice{text-align:center}}
@media (prefers-reduced-motion:no-preference){.choice,.primary,.secondary{transition:background-color .15s,border-color .15s}}
</style>
</head>
<body>
<div class="wrap">
 <header class="top"><a class="brand" href="/"><img src="family-logo.png" alt="" width="30" height="30"><span>FamTray · Bếp Nhà</span></a><div class="lang" role="group" aria-label="Ngôn ngữ / Language"><button type="button" data-lang="vi" aria-pressed="true">VI</button><button type="button" data-lang="en" aria-pressed="false">EN</button></div></header>
 <main id="rsvp" aria-live="polite"><section class="card"><p class="muted" id="loading">Đang mở lời mời…</p></section></main>
 <section class="card intro" id="intro"></section>
</div>
<script src="rsvp-page.js"></script>
</body>
</html>
