name: CI

# Runs every suite in `npm run test:all` on GitHub for every pull request and push
# (AGENTS.md rules 14–17). The list of suites is read from package.json at run time,
# so a suite added to test:all is automatically run here, split into parallel jobs.
# This workflow never deploys anything.
on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: list test:all steps
    runs-on: ubuntu-latest
    outputs:
      steps: ${{ steps.list.outputs.steps }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: Split test:all into parallel steps
        run: |
          node -e '
            const all = require("./package.json").scripts["test:all"].split("&&").map(s => s.trim()).filter(Boolean);
            if (!all.length) throw Error("test:all is empty");
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "steps=" + JSON.stringify(all) + "\n");
            console.log(all.join("\n"));
          '

  test:
    name: ${{ matrix.step }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        step: ${{ fromJSON(needs.plan.outputs.steps) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Every step gets Chromium: suites decide for themselves whether they need a browser
      # (e.g. test:scout parses fixtures in a real page), and a name filter silently misses them.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Resolve the synthetic test host
        run: echo "127.0.0.1 kitchen.localhost" | sudo tee -a /etc/hosts

      - name: Build
        run: npm run build

      - name: Run ${{ matrix.step }}
        run: ${{ matrix.step }}

      # Only failed steps upload screenshots (each upload is ~55 MB of committed evidence otherwise).
      - name: Upload review screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ strategy.job-index }}
          path: docs/reviews/**/*.png
          if-no-files-found: ignore
          retention-days: 14

  # A ready-to-install FamTray Scout zip for Henry: Actions → this run → Artifacts →
  # famtray-scout-extension (no commands needed). Not part of the test matrix above.
  # Set the repository variable SCOUT_SERVER_ORIGIN (Settings → Secrets and variables →
  # Actions → Variables) to bake in the app address; without it the address is typed once.
  extension-zip:
    name: build FamTray Scout extension zip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the extension
        env:
          SCOUT_SERVER_ORIGIN: ${{ vars.SCOUT_SERVER_ORIGIN }}
        run: npm run build && npx tsc -p tsconfig.extension.json && node scripts/build-extension.cjs

      - name: Upload famtray-scout-extension
        uses: actions/upload-artifact@v4
        with:
          name: famtray-scout-extension
          path: |
            dist-extension.zip
            dist-extension-store.zip
          if-no-files-found: error
          retention-days: 30

  all:
    name: npm run test:all
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every test:all step passed
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then echo "A test:all step failed: ${{ needs.test.result }}"; exit 1; fi
